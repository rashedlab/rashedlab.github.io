<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Banner</title>
<style>
  body {
    margin: 0;
    background: #0b1320;
    font-family: sans-serif;
  }

  #banner {
    width: 100%;
    height: 260px; /* adjust height here */
    position: relative;
    overflow: hidden;
    background: radial-gradient(circle at center, #0f1a2f, #050a14);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

<div id="banner">
  <canvas id="canvas"></canvas>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = document.getElementById("banner").offsetHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

const particles = [];
const numParticles = 100;

function initParticles() {
  particles.length = 0;
  for (let i = 0; i < numParticles; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 0.5,
      vy: (Math.random() - 0.5) * 0.5,
      radius: Math.random() * 2 + 1
    });
  }
}
initParticles();

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Connections
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      let dx = particles[i].x - particles[j].x;
      let dy = particles[i].y - particles[j].y;
      let dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 120) {
        ctx.strokeStyle = "rgba(100, 200, 255," + (1 - dist / 120) * 0.35 + ")";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.stroke();
      }
    }
  }

  // Particles
  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fillStyle = "#6ec1ff";
    ctx.fill();
  });
}

function update() {
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;

    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
  });
}

function animate() {
  update();
  draw();
  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
